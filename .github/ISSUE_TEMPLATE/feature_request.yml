name: Feature or change
description: Propose a new capability or a change to existing behavior.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        One request per issue. Describe the need before the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, from the user's point of view.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it works (the check or example that proves it).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: upload
    id: attachments
    attributes:
      label: Screenshots, mockups, or references
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.mov,.webm,.pdf"
